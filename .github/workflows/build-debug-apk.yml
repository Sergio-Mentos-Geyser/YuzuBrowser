
name: Build Yuzu Browser Derivative Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tab-session-json-backup

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Check environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone KVS Schema at fixed commit
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            https://github.com/rejasupotaro/kvs-schema.git \
            kvs-schema-source

          cd kvs-schema-source

          EXPECTED="da82f8d6c94c41057101921d222050378ad7190e"

          git checkout "$EXPECTED"

          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected commit: $EXPECTED"
          echo "Actual commit:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Unexpected source revision."
            exit 1
          fi

          echo "Version information:"
          cat gradle/version/version.properties

          echo "Gradle Wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK 28
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      - name: Switch to Java 8
        shell: bash
        run: |
          set -euo pipefail

          JAVA8="$JAVA_HOME_8_X64"

          test -d "$JAVA8"

          echo "JAVA_HOME=$JAVA8" >> "$GITHUB_ENV"
          echo "$JAVA8/bin" >> "$GITHUB_PATH"

          "$JAVA8/bin/java" -version

      - name: Disable obsolete Bintray publishing plugin
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("kvs-schema-source")

          root_file = root / "build.gradle"
          library_file = root / "library/build.gradle"
          compiler_file = root / "compiler/build.gradle"

          def remove_exact_line(path, target):
              source = path.read_text(encoding="utf-8")
              lines = source.splitlines(keepends=True)

              matches = [
                  line for line in lines
                  if line.strip() == target
              ]

              if len(matches) != 1:
                  raise RuntimeError(
                      f"Expected one occurrence of {target} "
                      f"in {path}, found {len(matches)}"
                  )

              result = "".join(
                  line for line in lines
                  if line.strip() != target
              )

              path.write_text(result, encoding="utf-8")

          def remove_publish_block(path):
              source = path.read_text(encoding="utf-8")

              pattern = (
                  r"(?m)^publish\s*\{"
                  r"[^{}]*"
                  r"^\}\s*\n?"
              )

              result, count = re.subn(
                  pattern,
                  "",
                  source
              )

              if count != 1:
                  raise RuntimeError(
                      f"Expected one publish block in "
                      f"{path}, found {count}"
                  )

              path.write_text(result, encoding="utf-8")

          remove_exact_line(
              root_file,
              "classpath 'com.novoda:bintray-release:0.9'"
          )

          for path in [library_file, compiler_file]:
              remove_exact_line(
                  path,
                  "apply plugin: 'com.novoda.bintray-release'"
              )
              remove_publish_block(path)

          print("Obsolete Bintray plugin disabled.")
          print("Original GitHub repositories unchanged.")
          PY

      - name: Add Maven Central to KVS Schema
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("kvs-schema-source/build.gradle")
          source = path.read_text(encoding="utf-8")

          old = (
              "repositories {\n"
              "        google()\n"
              "        jcenter()\n"
              "    }"
          )

          new = (
              "repositories {\n"
              "        google()\n"
              "        mavenCentral()\n"
              "        jcenter()\n"
              "    }"
          )

          count = source.count(old)

          if count != 2:
              raise RuntimeError(
                  f"Expected 2 repository blocks, found {count}"
              )

          source = source.replace(old, new)

          path.write_text(source, encoding="utf-8")

          print("Maven Central added.")
          PY

      - name: Check Gradle environment
        shell: bash
        working-directory: kvs-schema-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          java -version

          ./gradlew --version

      - name: Build KVS Schema libraries
        shell: bash
        working-directory: kvs-schema-source
        run: |
          set -euo pipefail

          ./gradlew \
            :library:assembleRelease \
            :compiler:jar \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Create local Maven repository
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import xml.etree.ElementTree as ET

          artifact_root = Path("kvs-schema-source")
          maven_root = Path("local-maven")
          group_path = Path("com/rejasupotaro")
          version = "5.1.0"

          def find_one(filename):
              matches = list(
                  artifact_root.rglob(filename)
              )
              if len(matches) != 1:
                  raise RuntimeError(
                      f"Expected exactly one {filename}, "
                      f"found {len(matches)}"
                  )
              return matches[0]

          library_source = find_one(
              "library-release.aar"
          )
          compiler_source = find_one(
              "compiler.jar"
          )

          def write_pom(
              destination,
              artifact_id,
              dependencies
          ):
              project = ET.Element("project", {
                  "xmlns":
                  "http://maven.apache.org/POM/4.0.0"
              })

              def add(parent, name, value):
                  element = ET.SubElement(
                      parent, name
                  )
                  element.text = value
                  return element

              add(project, "modelVersion", "4.0.0")
              add(project, "groupId", "com.rejasupotaro")
              add(project, "artifactId", artifact_id)
              add(project, "version", version)

              packaging = (
                  "aar"
                  if artifact_id == "kvs-schema"
                  else "jar"
              )
              add(project, "packaging", packaging)

              if dependencies:
                  dependencies_node = ET.SubElement(
                      project, "dependencies"
                  )

                  for group, name, dep_version in dependencies:
                      dependency = ET.SubElement(
                          dependencies_node,
                          "dependency"
                      )
                      add(dependency, "groupId", group)
                      add(dependency, "artifactId", name)
                      add(dependency, "version", dep_version)
                      add(dependency, "scope", "compile")

              tree = ET.ElementTree(project)
              ET.indent(tree, space="  ")

              tree.write(
                  destination,
                  encoding="utf-8",
                  xml_declaration=True
              )

          def install(
              artifact_id,
              source_file,
              extension,
              dependencies
          ):
              directory = (
                  maven_root
                  / group_path
                  / artifact_id
                  / version
              )
              directory.mkdir(
                  parents=True,
                  exist_ok=True
              )

              filename = (
                  f"{artifact_id}-{version}.{extension}"
              )

              shutil.copy2(
                  source_file,
                  directory / filename
              )

              write_pom(
                  directory
                  / f"{artifact_id}-{version}.pom",
                  artifact_id,
                  dependencies
              )

              print(
                  f"Installed: {directory / filename}"
              )

          install(
              "kvs-schema",
              library_source,
              "aar",
              []
          )

          install(
              "kvs-schema-compiler",
              compiler_source,
              "jar",
              [
                  (
                      "com.rejasupotaro",
                      "kvs-schema",
                      version
                  ),
                  (
                      "com.squareup",
                      "javapoet",
                      "1.2.0"
                  )
              ]
          )

          print("Local Maven repository created.")
          PY

      - name: Add local Maven repository to Gradle
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle")
          source = path.read_text(encoding="utf-8")

          marker = (
              "allprojects {\n"
              "    repositories {\n"
          )

          if source.count(marker) != 1:
              raise RuntimeError(
                  "Unexpected allprojects repositories"
              )

          local_repository = (
              "allprojects {\n"
              "    repositories {\n"
              "        maven {\n"
              "            url uri(rootProject.file('local-maven'))\n"
              "        }\n"
          )

          source = source.replace(
              marker,
              local_repository,
              1
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print("Local Maven repository added.")
          PY

      - name: Disable optional versions plugin
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle")
          source = path.read_text(encoding="utf-8")

          plugin = "com.github.ben-manes.versions"
          dependency = (
              "com.github.ben-manes:"
              "gradle-versions-plugin:0.36.0"
          )

          if source.count(plugin) != 1:
              raise RuntimeError(
                  "Unexpected plugin declaration"
              )

          if source.count(dependency) != 1:
              raise RuntimeError(
                  "Unexpected plugin dependency"
              )

          lines = source.splitlines(
              keepends=True
          )

          lines = [
              line for line in lines
              if plugin not in line
              and dependency not in line
          ]

          source = "".join(lines)

          start = source.index(
              "configurations {\n"
              "    dependencyUpdates.resolutionStrategy"
          )

          end = source.index(
              "\nallprojects {",
              start
          )

          source = (
              source[:start]
              + source[end + 1:]
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "Optional versions plugin disabled."
          )
          PY

      - name: Disable obsolete Fabric Gradle plugin
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          source = path.read_text(encoding="utf-8")

          target = (
              "classpath "
              "'io.fabric.tools:gradle:1.31.2'"
          )

          if source.count(target) != 1:
              raise RuntimeError(
                  "Unexpected Fabric dependency"
              )

          lines = source.splitlines(
              keepends=True
          )

          lines = [
              line for line in lines
              if target not in line
          ]

          path.write_text(
              "".join(lines),
              encoding="utf-8"
          )

          print(
              "Obsolete Fabric Gradle "
              "dependency removed."
          )
          PY

      - name: Show temporary changes
        shell: bash
        run: |
          set -euo pipefail

          git diff --check
          git diff -- build.gradle app/build.gradle

          echo "Local Maven files:"
          find local-maven -type f -print

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --version

      - name: Restore fixed debug signing key
        shell: bash
        env:
          YUZU_DEBUG_KEYSTORE_BASE64: ${{ secrets.YUZU_DEBUG_KEYSTORE_BASE64 }}
          YUZU_DEBUG_STORE_PASSWORD: ${{ secrets.YUZU_DEBUG_STORE_PASSWORD }}
          YUZU_DEBUG_KEY_ALIAS: ${{ secrets.YUZU_DEBUG_KEY_ALIAS }}
          YUZU_DEBUG_KEY_PASSWORD: ${{ secrets.YUZU_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in YUZU_DEBUG_KEYSTORE_BASE64 YUZU_DEBUG_STORE_PASSWORD YUZU_DEBUG_KEY_ALIAS YUZU_DEBUG_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/yuzubrowser-fixed-debug.jks"
          printf '%s' "$YUZU_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          echo "YUZU_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          source = path.read_text(encoding="utf-8")

          build_types = "    buildTypes {\n"
          debug = "        debug {\n"

          if source.count(build_types) != 1 or source.count(debug) != 1:
              raise RuntimeError("Unexpected Gradle signing configuration layout")

          signing = (
              "    signingConfigs {\n"
              "        fixedDebug {\n"
              "            storeFile file(System.getenv('YUZU_DEBUG_KEYSTORE_PATH'))\n"
              "            storePassword System.getenv('YUZU_DEBUG_STORE_PASSWORD')\n"
              "            keyAlias System.getenv('YUZU_DEBUG_KEY_ALIAS')\n"
              "            keyPassword System.getenv('YUZU_DEBUG_KEY_PASSWORD')\n"
              "        }\n"
              "    }\n"
          )

          source = source.replace(build_types, signing + build_types, 1)
          source = source.replace(
              debug,
              debug + "            signingConfig signingConfigs.fixedDebug\n",
              1
          )
          path.write_text(source, encoding="utf-8")
          print("Fixed debug signing configuration added temporarily.")
          PY

      - name: Verify fixed debug signing key
        shell: bash
        env:
          YUZU_DEBUG_STORE_PASSWORD: ${{ secrets.YUZU_DEBUG_STORE_PASSWORD }}
          YUZU_DEBUG_KEY_ALIAS: ${{ secrets.YUZU_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -keystore "$YUZU_DEBUG_KEYSTORE_PATH" \
            -storepass "$YUZU_DEBUG_STORE_PASSWORD" \
            -alias "$YUZU_DEBUG_KEY_ALIAS" > /dev/null
          echo "Fixed debug keystore and alias verified."

      - name: Build Debug APK
        shell: bash
        env:
          YUZU_DEBUG_STORE_PASSWORD: ${{ secrets.YUZU_DEBUG_STORE_PASSWORD }}
          YUZU_DEBUG_KEY_ALIAS: ${{ secrets.YUZU_DEBUG_KEY_ALIAS }}
          YUZU_DEBUG_KEY_PASSWORD: ${{ secrets.YUZU_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YuzuBrowser-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
