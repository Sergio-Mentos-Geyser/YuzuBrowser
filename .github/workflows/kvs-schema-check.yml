
name: Check and Build KVS Schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kvs-schema:
    name: Build KVS Schema 5.1.0
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out YuzuBrowser
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Find KVS Schema version
        shell: bash
        run: |
          set -euo pipefail

          REPO="https://github.com/rejasupotaro/kvs-schema.git"

          echo "Checking available tags..."

          git ls-remote --tags --refs "$REPO" \
            | tee kvs-tags.txt

          if grep -q $'refs/tags/5.1.0$' kvs-tags.txt; then
            TAG="5.1.0"
          elif grep -q $'refs/tags/v5.1.0$' kvs-tags.txt; then
            TAG="v5.1.0"
          else
            echo "::error::Version 5.1.0 tag not found."
            echo "A matching source revision must be identified."
            exit 1
          fi

          echo "Found tag: $TAG"
          echo "KVS_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Clone KVS Schema
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$KVS_TAG" \
            https://github.com/rejasupotaro/kvs-schema.git \
            kvs-schema-source

          cd kvs-schema-source

          echo "Selected revision:"
          git rev-parse HEAD

          echo "Gradle Wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          java -version

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found."
            exit 1
          fi

          "$SDKMANAGER" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      - name: Check Gradle environment
        shell: bash
        working-directory: kvs-schema-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --version

      - name: Build KVS Schema libraries
        shell: bash
        working-directory: kvs-schema-source
        run: |
          set -euo pipefail

          ./gradlew \
            :library:assembleRelease \
            :compiler:jar \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: List generated files
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "Library outputs:"
          find kvs-schema-source/library/build/outputs \
            -type f -print

          echo "Compiler outputs:"
          find kvs-schema-source/compiler/build/libs \
            -type f -print

      - name: Upload generated libraries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kvs-schema-build-results
          path: |
            kvs-schema-source/library/build/outputs/aar/*.aar
            kvs-schema-source/compiler/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
