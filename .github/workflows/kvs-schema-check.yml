
name: Check and Build KVS Schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kvs-schema:
    name: Build KVS Schema 5.1.0
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out YuzuBrowser
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone KVS Schema at fixed commit
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            https://github.com/rejasupotaro/kvs-schema.git \
            kvs-schema-source

          cd kvs-schema-source

          git checkout \
            da82f8d6c94c41057101921d222050378ad7190e

          EXPECTED="da82f8d6c94c41057101921d222050378ad7190e"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected commit: $EXPECTED"
          echo "Actual commit:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Unexpected source revision."
            exit 1
          fi

          echo "Version information:"
          cat gradle/version/version.properties

          echo "Gradle Wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK 28
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      - name: Switch to Java 8
        shell: bash
        run: |
          set -euo pipefail

          JAVA8="$JAVA_HOME_8_X64"

          test -d "$JAVA8"

          echo "JAVA_HOME=$JAVA8" >> "$GITHUB_ENV"
          echo "$JAVA8/bin" >> "$GITHUB_PATH"

          "$JAVA8/bin/java" -version

      - name: Check Gradle environment
        shell: bash
        working-directory: kvs-schema-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          java -version

          ./gradlew --version

      - name: Build KVS Schema libraries
        shell: bash
        working-directory: kvs-schema-source
        run: |
          set -euo pipefail

          ./gradlew \
            :library:assembleRelease \
            :compiler:jar \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: List generated files
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "Library outputs:"
          find kvs-schema-source/library/build/outputs \
            -type f -print

          echo "Compiler outputs:"
          find kvs-schema-source/compiler/build/libs \
            -type f -print

      - name: Upload generated libraries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kvs-schema-build-results
          path: |
            kvs-schema-source/library/build/outputs/aar/*.aar
            kvs-schema-source/compiler/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
