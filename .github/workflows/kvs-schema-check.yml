
name: Check and Build KVS Schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kvs-schema:
    name: Build KVS Schema 5.1.0
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out YuzuBrowser
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone KVS Schema at fixed commit
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            https://github.com/rejasupotaro/kvs-schema.git \
            kvs-schema-source

          cd kvs-schema-source

          EXPECTED="da82f8d6c94c41057101921d222050378ad7190e"

          git checkout "$EXPECTED"

          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected commit: $EXPECTED"
          echo "Actual commit:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Unexpected source revision."
            exit 1
          fi

          echo "Version information:"
          cat gradle/version/version.properties

          echo "Gradle Wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK 28
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      - name: Switch to Java 8
        shell: bash
        run: |
          set -euo pipefail

          JAVA8="$JAVA_HOME_8_X64"

          test -d "$JAVA8"

          echo "JAVA_HOME=$JAVA8" >> "$GITHUB_ENV"
          echo "$JAVA8/bin" >> "$GITHUB_PATH"

          "$JAVA8/bin/java" -version

      - name: Disable obsolete Bintray publishing plugin
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("kvs-schema-source")

          root_file = root / "build.gradle"
          library_file = root / "library/build.gradle"
          compiler_file = root / "compiler/build.gradle"

          def remove_exact_line(path, target):
              source = path.read_text(encoding="utf-8")
              lines = source.splitlines(keepends=True)

              matches = [
                  line for line in lines
                  if line.strip() == target
              ]

              if len(matches) != 1:
                  raise RuntimeError(
                      f"Expected one occurrence of {target} "
                      f"in {path}, found {len(matches)}"
                  )

              result = "".join(
                  line for line in lines
                  if line.strip() != target
              )

              path.write_text(result, encoding="utf-8")

          def remove_publish_block(path):
              source = path.read_text(encoding="utf-8")

              pattern = (
                  r"(?m)^publish\s*\{"
                  r"[^{}]*"
                  r"^\}\s*\n?"
              )

              result, count = re.subn(
                  pattern,
                  "",
                  source
              )

              if count != 1:
                  raise RuntimeError(
                      f"Expected one publish block in "
                      f"{path}, found {count}"
                  )

              path.write_text(result, encoding="utf-8")

          remove_exact_line(
              root_file,
              "classpath 'com.novoda:bintray-release:0.9'"
          )

          for path in [library_file, compiler_file]:
              remove_exact_line(
                  path,
                  "apply plugin: 'com.novoda.bintray-release'"
              )
              remove_publish_block(path)

          print("Obsolete Bintray plugin disabled.")
          print("Original GitHub repositories unchanged.")
          PY

      - name: Add Maven Central to KVS Schema
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("kvs-schema-source/build.gradle")
          source = path.read_text(encoding="utf-8")

          old = (
              "repositories {\n"
              "        google()\n"
              "        jcenter()\n"
              "    }"
          )

          new = (
              "repositories {\n"
              "        google()\n"
              "        mavenCentral()\n"
              "        jcenter()\n"
              "    }"
          )

          count = source.count(old)

          if count != 2:
              raise RuntimeError(
                  f"Expected 2 repository blocks, found {count}"
              )

          source = source.replace(old, new)

          path.write_text(source, encoding="utf-8")

          print("Maven Central added.")
          PY

      - name: Show temporary changes
        shell: bash
        run: |
          set -euo pipefail

          git -C kvs-schema-source diff --check

          git -C kvs-schema-source diff -- \
            build.gradle \
            library/build.gradle \
            compiler/build.gradle

      - name: Check Gradle environment
        shell: bash
        working-directory: kvs-schema-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          java -version

          ./gradlew --version

      - name: Build KVS Schema libraries
        shell: bash
        working-directory: kvs-schema-source
        run: |
          set -euo pipefail

          ./gradlew \
            :library:assembleRelease \
            :compiler:jar \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: List generated files
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "Library outputs:"

          find kvs-schema-source/library/build/outputs \
            -type f -print

          echo "Compiler outputs:"

          find kvs-schema-source/compiler/build/libs \
            -type f -print

      - name: Upload generated libraries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kvs-schema-build-results
          path: |
            kvs-schema-source/library/build/outputs/aar/*.aar
            kvs-schema-source/compiler/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
