
name: Build YuzuBrowser APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Check environment
        shell: bash
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Check KVS Schema availability
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error

          repositories = {
              "Maven Central":
                  "https://repo.maven.apache.org/maven2",
              "JCenter":
                  "https://jcenter.bintray.com",
              "Spring Milestone":
                  "https://repo.spring.io/milestone",
              "Spring Release":
                  "https://repo.spring.io/release",
          }

          artifacts = {
              "kvs-schema": "aar",
              "kvs-schema-compiler": "jar",
          }

          group_path = "com/rejasupotaro"
          version = "5.1.0"

          for repo_name, base_url in repositories.items():
              print(f"\nRepository: {repo_name}", flush=True)

              for artifact, extension in artifacts.items():
                  path = (
                      f"{group_path}/{artifact}/{version}/"
                      f"{artifact}-{version}.{extension}"
                  )
                  url = f"{base_url}/{path}"

                  request = urllib.request.Request(
                      url,
                      method="GET",
                      headers={
                          "User-Agent": "YuzuBrowser-Build-Diagnostic",
                          "Range": "bytes=0-0",
                      },
                  )

                  try:
                      with urllib.request.urlopen(
                          request, timeout=20
                      ) as response:
                          status = response.status
                          print(
                              f"{artifact}: HTTP {status}",
                              flush=True,
                          )
                  except urllib.error.HTTPError as error:
                      print(
                          f"{artifact}: HTTP {error.code}",
                          flush=True,
                      )
                  except Exception as error:
                      print(
                          f"{artifact}: {type(error).__name__}: "
                          f"{error}",
                          flush=True,
                      )
          PY

      - name: Disable optional versions plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle")
          source = path.read_text(encoding="utf-8")

          plugin = "com.github.ben-manes.versions"
          dependency = (
              "com.github.ben-manes:"
              "gradle-versions-plugin:0.36.0"
          )

          if source.count(plugin) != 1:
              raise RuntimeError(
                  "Unexpected plugin declaration"
              )

          if source.count(dependency) != 1:
              raise RuntimeError(
                  "Unexpected plugin dependency"
              )

          lines = source.splitlines(keepends=True)
          lines = [
              line for line in lines
              if plugin not in line
              and dependency not in line
          ]
          source = "".join(lines)

          start = source.index(
              "configurations {\n"
              "    dependencyUpdates.resolutionStrategy"
          )
          end = source.index(
              "\nallprojects {", start
          )

          source = source[:start] + source[end + 1:]

          path.write_text(source, encoding="utf-8")
          print("Optional versions plugin disabled.")
          PY

      - name: Disable obsolete Fabric Gradle plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          source = path.read_text(encoding="utf-8")

          target = (
              "classpath "
              "'io.fabric.tools:gradle:1.31.2'"
          )

          if source.count(target) != 1:
              raise RuntimeError(
                  "Unexpected Fabric dependency"
              )

          lines = source.splitlines(keepends=True)
          lines = [
              line for line in lines
              if target not in line
          ]

          path.write_text(
              "".join(lines),
              encoding="utf-8"
          )

          print(
              "Obsolete Fabric Gradle "
              "dependency removed."
          )
          PY

      - name: Show temporary changes
        shell: bash
        run: |
          git diff --check
          git diff -- build.gradle app/build.gradle

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YuzuBrowser-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
